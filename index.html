<title>Continuous Growing Loop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed isometric model of the glasshouse (her Rhino model); step card top-left, 5-step rail along the bottom. Committed light "model table" look, same family as Mound Making. Colours follow her sketch: red = flower route, blue = van. */
:root{
  --table:#ebe8e7;
  --ink:#231e1f;
  --ink-2:#655c5d;
  --rule:#d5cccd;
  --card:rgba(252,250,250,.93);
  --tulip:#d6457f; --robot:#d99a16; --route:#e0344f; --van:#2f6fd8; --fresh:#3a9a4f; --neutral:#7a706c;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 60% 40%,#f7f5f5 0%,var(--table) 70%)}
#stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;color:var(--ink);white-space:nowrap;transition:opacity .4s;text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 9px #fff}
.lbl small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:0;color:var(--ink-2);margin-left:5px}
.lbl.floor{font-size:18px;text-transform:uppercase}
.lbl.pink{color:var(--tulip)} .lbl.robot{color:#a87308} .lbl.red{color:var(--route)} .lbl.blue{color:var(--van)} .lbl.green{color:var(--fresh)} .lbl.small{font-size:14px;color:var(--ink-2)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-2);pointer-events:none;transition:opacity .5s}

.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid var(--rule);border-radius:4px;padding:18px 20px 16px;width:min(390px,100%);min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stepno{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.stepno b{font-family:var(--display);font-size:56px;line-height:.85;font-weight:700;color:var(--accent,var(--neutral));transition:color .4s}
.stepno h1{font-family:var(--display);font-size:26px;line-height:1;font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
.desc{font-size:14px;line-height:1.5;margin:12px 0 0;max-width:62ch}
.metric{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.metric strong{color:var(--accent,var(--ink));font-weight:500}
.phases[hidden]{display:none}
.phases{margin-top:12px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.phases div{position:relative;font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;color:var(--ink-2);padding-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phases div::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:1px;background:#e2dbdc}
.phases div i{position:absolute;left:0;top:0;height:5px;border-radius:1px;background:var(--c);width:0}
.phases div.on{color:var(--ink);font-weight:500}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:7px 10px;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#f7f4f4;border-color:var(--ink)}
.hint{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;line-height:1.6}
.chip:focus-visible,.rail button:focus-visible,.nav:focus-visible{outline:2px solid var(--tulip);outline-offset:2px}
.bottom{display:flex;align-items:stretch;gap:10px}
.nav{font-family:var(--display);font-weight:600;font-size:20px;width:46px;flex:none;background:var(--card);border:1px solid var(--rule);border-radius:4px;color:var(--ink);cursor:pointer}
.nav.play{width:auto;padding:0 14px;font-size:15px;letter-spacing:.06em}
.nav.play[aria-pressed="true"]{background:var(--ink);color:#f7f4f4;border-color:var(--ink)}
.rail{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;min-width:0}
.rail button{position:relative;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:9px 11px 11px;cursor:pointer;color:var(--ink);min-width:0;overflow:hidden}
.rail .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--c)}
.rail .t{display:block;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail button::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c)}
.rail button[aria-current="step"]{border-color:var(--c);background:#fff}
.rail button[aria-current="step"]::after{width:100%}
.rail button.done .n{opacity:.55}
@media (max-width:720px){
  .rail .t{display:none} .rail button{text-align:center;padding:8px 4px 10px}
  .card{padding:14px 14px 12px} .stepno b{font-size:42px} .stepno h1{font-size:21px} .desc{font-size:13px}
  .top{flex-direction:column} .side{align-items:flex-start} .tools{justify-content:flex-start} .hint{display:none}
  .ui{justify-content:flex-start;gap:10px} .bottom{margin-top:auto} .legend{display:none}
}
@media (max-width:720px) and (max-height:760px){ .desc{display:none} }
</style>

  </div>
</div>

  const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false);
  const a = w/h; VS = a < 0.8 ? 150 : 100;
  cam.left = -VS*a/2; cam.right = VS*a/2; cam.top = VS/2; cam.bottom = -VS/2; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);

const V = (x,y,z) => new THREE.Vector3(x,y,z);

const ease = t => { t = clamp01(t); return t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; };
const seg = (p, a, b) => ease((p - a)/(b - a));

const dummy = new THREE.Object3D(), cBulb = new THREE.Color(0x9a7a52), cLeaf = new THREE.Color(0x5f9e4a), cBloom = new THREE.Color(0xd8285f), tmpC = new THREE.Color();
const ZERO = new THREE.Matrix4().makeScale(0,0,0);
function setTray(i, pos, stg, vis, sc=1){
  if (!vis || sc <= 0.001){ trayMesh.setMatrixAt(i, ZERO); for (let j=0;j<4;j++) budMesh.setMatrixAt(i*4+j, ZERO); return; }
  dummy.position.copy(pos); dummy.rotation.set(0,0,0); dummy.scale.set(sc,sc,sc); dummy.updateMatrix(); trayMesh.setMatrixAt(i, dummy.matrix);
  const h = (.08 + .5*stg)*sc, r = (.07 + .1*stg)*sc;
  if (stg < .35) tmpC.copy(cBulb).lerp(cLeaf, stg/.35); else tmpC.copy(cLeaf).lerp(cBloom, clamp01((stg-.55)/.4));
  BUD.forEach(([bx,bz], j) => {
    dummy.position.set(pos.x + bx*sc, pos.y + .06*sc, pos.z + bz*sc); dummy.scale.set(r, h, r); dummy.updateMatrix();
    budMesh.setMatrixAt(i*4+j, dummy.matrix); budMesh.setColorAt(i*4+j, tmpC);
  });
}
function loopXY(m, s){ s = ((s % NP) + NP) % NP; const a = Math.floor(s), f = s - a, p = m.pos[a], q = m.pos[(a+1) % NP]; return [lerp(p[0], q[0], f), lerp(p[1], q[1], f)]; }
const tmpV = new THREE.Vector3();
function trayWorld(t, out){ const m = machines[t.mi], [x, y] = loopXY(m, t.slot + m.rot); return out.set(x, y, m.lanes[t.lane]); }

// ---------- robot, lift, packing room, van ----------
const AX = 22.1, FLOOR = 9.6, CY = 11.9, LIFT_Z = 17.5, LT = FLOOR, LB = .85;
const rMat = lam(COL.robot), dMat = lam(COL.robotDk);
box(.12, .04, 96, lam(0x6d6566), AX, FLOOR+.02, -15.2);              // walk line rail
const robot = new THREE.Group(); scene.add(robot);
box(1.1, .45, 1.6, rMat, 0, FLOOR+.25, 0, robot);                     // base cart
const mast = box(.22, 3.6, .22, dMat, 0, FLOOR+.45+1.8, 0, robot);
const carriage = box(.5, .3, .6, rMat, 0, 0, 0);
const armBar = box(1, .1, .14, dMat, 0, 0, 0);
const fork = box(1.5, .05, 1.5, lam(0xf0c060), 0, 0, 0);
const scanMat = new THREE.MeshBasicMaterial({color:COL.robot, transparent:true, opacity:0, depthWrite:false, side:THREE.DoubleSide});
const scan = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.6, 8, 32, 1, true), scanMat); scene.add(scan);
// lift through the slab, down into packing
for (const dx of [-.9,.9]) for (const dz of [-1,1]) box(.08, FLOOR+1.2, .08, lam(0x8f8889), AX+dx, (FLOOR+1.2)/2, LIFT_Z+dz);
box(1.9, .02, 2.1, lam(0x3a3435), AX, FLOOR+.03, LIFT_Z);           // opening
const liftPlat = box(1.7, .1, 1.9, lam(0x9e9798), AX, LT-.05, LIFT_Z);
// packing room furniture (ground, under the bridge)
const conv = lam(0x4a4344), table = lam(0xd3cbc5);
box(1.4, .2, 10.5, conv, AX, LB-.1, 12.25);                           // tray line to packing
box(8, .2, 1.1, conv, 29.4, LB-.1, 7);                                // box line to the van door
for (const x of [19.6, 24.6]) { box(2.2, .9, 3.2, table, x, .45, 7); for (let j=0;j<3;j++) box(.5,.35,.5, lam(0xc89a62), x, 1.07, 6+j); }
box(2.6, 2.6, 2.2, lam(0xcfe0ea, {transparent:true, opacity:.6}), 29, 1.3, LIFT_Z);   // bulb cold store
// van
const van = new THREE.Group(); scene.add(van);
box(2.2, 2.3, 4.2, lam(0xf6f3f1), 0, 1.45, 0, van);
box(2.1, 1.7, 1.5, lam(COL.van), 0, 1.15, 2.85, van);
for (const [x,z] of [[-1.05,-1.3],[1.05,-1.3],[-1.05,2.6],[1.05,2.6]]){ const w = new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.25,16), lam(0x3a3435)); w.rotation.z = Math.PI/2; w.position.set(x,.42,z); van.add(w); }
const VAN_PATH = new THREE.CurvePath();
[[V(35.4,0,9),V(35.4,0,44)],[V(35.4,0,44),V(42.4,0,51)],[V(42.4,0,51),V(80,0,51)]].forEach(([a,b],i) => VAN_PATH.add(i===1 ? new THREE.QuadraticBezierCurve3(a, V(35.4,0,51), b) : new THREE.LineCurve3(a,b)));
function placeVan(u){ u = clamp01(u); const p = VAN_PATH.getPointAt(u), t = VAN_PATH.getTangentAt(Math.min(.999, Math.max(.001,u))); van.position.copy(p); van.rotation.y = Math.atan2(t.x, t.z); van.visible = u < .985; }
const boxMesh = box(.7,.45,.7, lam(0xc89a62), 0, -50, 0);

// ---------- routes (red = flowers, blue = van, green = fresh tray) ----------
let routes = [];
function tube(points, color, r=.14){
  const path = new THREE.CurvePath(); for (let i=0;i<points.length-1;i++) path.add(new THREE.LineCurve3(points[i], points[i+1]));
  const g = new THREE.TubeGeometry(path, 300, r, 6, false);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({color, depthTest:false, transparent:true, opacity:.9}));
  m.renderOrder = 6; m.userData.total = g.index.count; m.userData.show = 0; g.setDrawRange(0,0); scene.add(m); return m;
}
function buildRoutes(m, zc){
  routes.forEach(r => { scene.remove(r); r.geometry.dispose(); });
  const pk = m.pos[m.pick];
  const red = [V(pk[0], pk[1]+.6, zc), V(AX, CY+.6, zc), V(AX, CY+.6, LIFT_Z), V(AX, LB+.6, LIFT_Z), V(AX, LB+.6, 7)];
  const blue = [V(24.6, 1.5, 7), V(34, 1.5, 7), V(35.4, 1.5, 9), V(35.4, 1.5, 44), V(38, 1.5, 49), V(42.4, 1.5, 51), V(80, 1.5, 51)];
  const green = [V(29, 1.2, LIFT_Z+.6), V(AX+.6, 1.2, LIFT_Z+.6), V(AX+.6, CY+.3, LIFT_Z+.6), V(AX+.6, CY+.3, zc), V(pk[0], pk[1]+.3, zc)];
  routes = [tube(red, COL.route), tube(blue, COL.van), tube(green, COL.fresh, .1)];
}

// ---------- the robot routine ----------
const TGT = [26, 13, 25, 12, 27, 14, 24, 11, 28, 15];
const R = {ph:-1, p:1, fast:false, q:[], ctx:null, n:-1, zPark:2, loop:false};
let lastZ = 2;
function startCycle(){
  R.n++; const m = machines[TGT[R.n % TGT.length]];
  let best = 0, bd = 99;
  for (let k=0;k<NP;k++){ let d = ((m.pick - k - m.rot) % NP + NP) % NP; if (d < 1.5) d += NP; if (d < bd){ bd = d; best = k; } }
  const picked = trays.map((t,i) => i).filter(i => trays[i].mi === m.i && trays[i].slot === best && trays[i].lane < 2);
  picked.forEach(i => trays[i].st = 1);
  const zc = (m.lanes[0] + m.lanes[1]) / 2;
  m.busy = true;
  R.ctx = {m, k:best, picked, rot0:m.rot, d:bd, zFrom:lastZ, zc, pk:m.pos[m.pick]};
  buildRoutes(m, zc);
}
function commit(){
  const c = R.ctx; if (!c) return;
  c.picked.forEach(i => trays[i].st = .04); c.m.busy = false; R.zPark = c.zc; R.ctx = null; R.ph = -1; R.p = 1;
}
function pose(){
  const c = R.ctx, ph = R.ph, p = R.p;
  const o = {z:R.zPark, fy:CY, reach:0, scan:0, liftY:LT, slot:false, A:null, B:null, Asc:1, box:null, van:0, rx:AX};
  if (!c || ph < 0) return o;
  const PY = c.pk[1] - .1; o.rx = c.pk[0];
  if (ph === 0){ o.z = lerp(c.zFrom, c.zc, ease(p)); o.scan = Math.sin(Math.PI*clamp01(p*1.05)); }
  else if (ph === 1){ o.z = c.zc; o.fy = lerp(CY, PY, seg(p,0,.35)) + .2*seg(p,.85,1); o.reach = seg(p,.4,.8); if (p >= .85){ o.slot = true; o.A = 'fork'; } }
  else if (ph === 2){ o.slot = true; o.A = 'fork'; o.reach = 1 - seg(p,0,.2); o.fy = lerp(PY+.2, CY, seg(p,.2,.35)); o.z = lerp(c.zc, LIFT_Z, seg(p,.35,1)); }
  else if (ph === 3){ o.slot = true; o.z = LIFT_Z;
    if (p < .3){ o.fy = lerp(CY, LT+.02, ease(p/.3)); o.A = 'fork'; } else { o.fy = lerp(LT+.02, CY, seg(p,.3,.45)); o.A = 'lift'; }
    o.liftY = lerp(LT, LB, seg(p,.4,1)); }
  else if (ph === 4){ o.slot = true; o.z = LIFT_Z; o.liftY = LB;
    o.A = V(AX, LB+.06, lerp(LIFT_Z, 7.6, seg(p,0,.3))); o.Asc = 1 - seg(p,.3,.4);
    if (p > .36 && p < .62) o.box = V(lerp(24.6, 34.2, seg(p,.38,.58)), LB+.25, 7 + 1.2*seg(p,.56,.62));
    o.van = seg(p,.62,1);
    if (p > .4) o.B = V(lerp(29, AX, seg(p,.45,.9)), LB+.06, LIFT_Z); }
  else if (ph === 5){ o.slot = true; o.z = LIFT_Z; o.liftY = lerp(LB, LT, ease(p)); o.B = 'lift'; o.van = 1 - .3*p; }
  else if (ph === 6){ o.slot = true; o.van = .7*(1 - ease(p));
    o.z = p < .3 ? LIFT_Z : lerp(LIFT_Z, c.zc, seg(p,.3,.7));
    if (p < .12){ o.fy = lerp(CY, LT+.02, ease(p/.12)); o.B = 'lift'; }
    else if (p < .7){ o.fy = lerp(LT+.02, CY, seg(p,.12,.3)); o.B = 'fork'; }
    else if (p < .9){ o.fy = lerp(CY, PY+.2, seg(p,.7,.8)); o.reach = seg(p,.8,.9); o.B = 'fork'; }
    else { o.fy = PY; o.reach = 1 - seg(p,.92,1); o.slot = false; }
  }
  return o;
}
function tickRoutine(dt){
  if (R.ph >= 0){
    R.p = RM ? 1 : Math.min(1, R.p + dt*(R.fast ? 7 : 1)/PH[R.ph].dur);
    if (R.ph === 0) R.ctx.m.rot = R.ctx.rot0 + R.ctx.d*ease(R.p);
    if (R.p >= 1 && R.ph === 6) commit();
  }
  if (R.ph < 0 || R.p >= 1){
    if (!R.q.length && R.loop){ const from = R.ph >= 0 ? R.ph+1 : 0; for (let i=from;i<7;i++) R.q.push({i, fast:false}); if (from) for (let i=0;i<7;i++) R.q.push({i, fast:false}); }
    if (R.q.length){ const e = R.q.shift(); if (e.i === 0){ if (R.ph >= 0) commit(); startCycle(); } R.ph = e.i; R.p = RM ? 1 : 0; R.fast = e.fast; }
  }
}
function plan(n){
  const T = STEP_PH[n], cur = R.ph, q = [];
  const finishRest = () => { if (cur >= 0){ R.fast = true; for (let i=cur+1;i<7;i++) q.push({i, fast:true}); } };
  if (!T.length) finishRest();
  else if (cur >= 0 && cur <= T[0]){ R.fast = cur < T[0]; for (let i=cur+1;i<=T[T.length-1];i++) q.push({i, fast:i<T[0]}); }
  else { finishRest(); for (let i=0;i<=T[T.length-1];i++) q.push({i, fast:i<T[0]}); }
  R.q = q;
}

// ---------- camera framing per step ----------
const VIEWS = [
  {t:() => V(-2, 6, -12), dir:V(1, .82, .62), zoom:.72},
  {t:() => V(22, 14, -4.5), dir:V(1, .55, .8), zoom:3.0},
  {t:() => V(AX - 1, 11.5, P.z), dir:V(1, .6, .85), zoom:3.4},
  {t:() => V(AX, 6.5, Math.min(P.z, LIFT_Z)), dir:V(1, .38, .75), zoom:2.3},
  {t:() => V(28, 3, 22), dir:V(1, .42, .48), zoom:1.35}
];
VIEWS.forEach(v => v.dir.normalize());
let follow = true;
const camT = new THREE.Vector3(), camD = new THREE.Vector3();
function home(){ const v = VIEWS[0]; controls.target.copy(v.t()); cam.position.copy(controls.target).addScaledVector(v.dir, 300); cam.zoom = v.zoom; cam.updateProjectionMatrix(); controls.update(); }
function camFollow(dt){
  if (!follow) return;
  const v = VIEWS[step], k = Math.min(1, dt*1.8), narrow = stage.clientWidth/stage.clientHeight < .8;
  camT.copy(v.t()); controls.target.lerp(camT, k);
  camD.copy(cam.position).sub(controls.target).normalize().lerp(v.dir, k).normalize();
  cam.position.copy(controls.target).addScaledVector(camD, 300);
  cam.zoom += (v.zoom*(narrow ? .85 : 1) - cam.zoom)*k; cam.updateProjectionMatrix();
}
function setFollow(on){ follow = on; document.getElementById('follow').setAttribute('aria-pressed', String(on)); }
controls.addEventListener('start', () => setFollow(false));

// ---------- labels ----------
const labelsEl = document.getElementById('labels'), labels = [];
function addLabel(html, cls, posFn, showFn){ const el = document.createElement('div'); el.className = 'lbl ' + cls; el.innerHTML = html; el.style.opacity = 0; labelsEl.appendChild(el); labels.push({el, posFn, showFn}); }
let P = pose();
addLabel('East wing<small>glasshouse</small>', 'floor pink', () => V(22, 26, -40), () => step === 0);
addLabel('West wing<small>glasshouse</small>', 'floor pink', () => V(-22, 26, -40), () => step === 0);
addLabel('bridge', 'small', () => V(0, 17, 11), () => step === 0);
addLabel('Ground floor<small>market</small>', 'floor', () => V(22, 3, -30), () => step === 0);
addLabel('packing room', 'blue', () => V(22, 2.6, 11), () => step === 0 || step === 4);
addLabel('tulip machine<small>12 positions × 4 lanes</small>', 'pink', () => V(17.6, 19.6, -4.5), () => step === 1);
addLabel('light at the top', 'small', () => V(26.6, 19.4, -10.2), () => step === 1);
addLabel('robot walk line', 'robot', () => V(AX, FLOOR+.4, -22), () => step === 2);
addLabel('robot', 'robot', () => V(AX, FLOOR+5.2, P.z), () => step >= 2 && step <= 3);
addLabel('ready trays', 'pink', () => R.ctx ? V(R.ctx.pk[0], R.ctx.pk[1]+1.6, R.ctx.zc) : V(0,0,0), () => step === 2 && R.ctx && R.ph <= 1 && !P.slot);
addLabel('lift<small>tray down</small>', 'red', () => V(AX+1.4, 5.5, LIFT_Z+1.2), () => step === 3);
addLabel('packing', 'red', () => V(22, 2.6, 6), () => step === 3);
addLabel('van', 'blue', () => van.position.clone().add(V(0, 3.4, 0)), () => step === 4 && van.visible);
addLabel('to the market + city', 'blue', () => V(60, 2.6, 51), () => step === 4);
addLabel('bulb cold store', 'green', () => V(29, 3.6, LIFT_Z), () => step === 4);

// ---------- UI ----------
const rail = document.getElementById('rail'), phasesEl = document.getElementById('phases');
STEPS.forEach((s,i) => { const b = document.createElement('button'); b.type = 'button'; b.style.setProperty('--c', s.c); b.innerHTML = `<span class="n">0${i+1}</span><span class="t">${s.s}</span>`; b.addEventListener('click', () => setStep(i, true)); rail.appendChild(b); });
PH.forEach(ph => { const d = document.createElement('div'); d.style.setProperty('--c', ph.c); d.innerHTML = `<i></i>${ph.n}`; phasesEl.appendChild(d); });
const phEls = [...phasesEl.children];
let step = 0;
function showCard(n){
  step = n; const s = STEPS[n];
  document.documentElement.style.setProperty('--accent', s.c);
  document.getElementById('no').textContent = '0' + (n+1);
  document.getElementById('ttl').textContent = s.t;
  document.getElementById('desc').textContent = s.d;
  document.getElementById('metric').innerHTML = s.m;
  phasesEl.hidden = n < 2;
  rail.querySelectorAll('button').forEach((b,i) => { b.setAttribute('aria-current', i===n ? 'step' : 'false'); b.classList.toggle('done', i<n); });
  glass.visible = n === 0; document.getElementById('glass').setAttribute('aria-pressed', String(glass.visible));
}
function setStep(n, user){
  n = Math.max(0, Math.min(4, n));
  if (user) stopPlay();
  showCard(n); plan(n);
  try { localStorage.setItem('tulip2-step', String(n)); } catch(e){}
}
let playing = false, playT = 0;
const playBtn = document.getElementById('play');
function startPlay(){ playing = true; playT = 0; playBtn.setAttribute('aria-pressed','true'); playBtn.textContent = 'PAUSE'; if (step >= 2) R.loop = true; }
function stopPlay(){ playing = false; R.loop = false; playBtn.setAttribute('aria-pressed','false'); playBtn.textContent = 'PLAY'; }
playBtn.addEventListener('click', () => playing ? stopPlay() : startPlay());
document.getElementById('prev').addEventListener('click', () => setStep(step-1, true));
document.getElementById('next').addEventListener('click', () => setStep(step+1, true));
addEventListener('keydown', e => { if (e.key === 'ArrowRight') setStep(step+1, true); if (e.key === 'ArrowLeft') setStep(step-1, true); });
document.getElementById('reset').addEventListener('click', () => { home(); setFollow(true); });
const gBtn = document.getElementById('glass');
gBtn.addEventListener('click', () => { glass.visible = !glass.visible; gBtn.setAttribute('aria-pressed', String(glass.visible)); });
const fBtn = document.getElementById('follow');
fBtn.addEventListener('click', () => setFollow(!follow));

// ---------- frame loop ----------
const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (playing){
    if (step < 2){ playT += dt; if (playT > 8){ playT = 0; showCard(step+1); plan(step); if (step >= 2) R.loop = true; } }
    else { R.loop = true; const ph = R.ph; const want = ph < 0 ? step : ph <= 1 ? 2 : ph <= 3 ? 3 : 4; if (want !== step && !R.fast) showCard(want); }
  }
  tickRoutine(dt);
  P = pose(); lastZ = P.z;

  // carousels
  const spin = step === 1 ? .7 : .1;
  machines.forEach(m => { if (!m.busy && !RM) m.rot += spin*dt; });
  const hide = (R.ctx && P.slot) ? new Set(R.ctx.picked) : null;
  trays.forEach((tr, i) => setTray(i, trayWorld(tr, tmpV), tr.st, !(hide && hide.has(i))));

  // robot
  const fy = P.fy, fx = lerp(AX, P.rx, P.reach);
  robot.position.set(AX, 0, P.z);
  carriage.position.set(AX, fy + .2, P.z);
  armBar.position.set((AX + fx)/2, fy + .08, P.z); armBar.scale.x = Math.max(.01, Math.abs(fx - AX));
  fork.position.set(fx, fy - .025, P.z);
  scan.position.set(AX, FLOOR + 4, P.z); scanMat.opacity = .1*P.scan; scan.scale.set(1 + .08*Math.sin(t*5), 1, 1);
  liftPlat.position.y = P.liftY - .05;
  placeVan(P.van);

  // travelling trays: A = harvest (2 trays), B = fresh bulbs (2 trays)
  const at = (w) => w === 'fork' ? V(fx, fy + .08, P.z) : w === 'lift' ? V(AX, P.liftY + .08, LIFT_Z) : w;
  const N = trays.length;
  setTray(N, tmpV, 0, false); setTray(N+1, tmpV, 0, false);
  if (P.A && P.B){ setTray(N, at(P.A), 1, true, P.Asc); setTray(N+1, at(P.B), .04, true); }
  else if (P.A){ const c = at(P.A); setTray(N, c.clone().add(V(0,0,-.375)), 1, true, P.Asc); setTray(N+1, P.B ? at(P.B).clone().add(V(0,0,-.375)) : c.clone().add(V(0,0,.375)), P.B ? .04 : 1, true, P.B ? 1 : P.Asc); }
  else if (P.B){ const c = at(P.B); setTray(N, c.clone().add(V(0,0,-.375)), .04, true); setTray(N+1, c.clone().add(V(0,0,.375)), .04, true); }
  if (P.box){ boxMesh.position.copy(P.box); boxMesh.visible = true; } else boxMesh.visible = false;
  trayMesh.instanceMatrix.needsUpdate = true; budMesh.instanceMatrix.needsUpdate = true; budMesh.instanceColor.needsUpdate = true;

  // routes reveal
  if (routes.length){
    const ph = R.ph;
    const red = step >= 3 || (playing && ph >= 2) ? (ph >= 4 || ph < 0 ? 1 : ph === 3 ? .62 + .38*R.p : .62*Math.max(.15, R.p)) : 0;
    const blue = ph === 4 ? clamp01((R.p - .36)/.6) : (ph >= 5 || (ph < 0 && step === 4)) ? 1 : 0;
    const green = ph === 5 ? .3*R.p : ph === 6 ? .3 + .7*R.p : (ph < 0 && step === 4) ? 1 : ph === 4 ? .18*clamp01((R.p-.45)/.45) : 0;
    [red, blue, green].forEach((v, i) => { const r = routes[i]; r.userData.show += (v - r.userData.show)*Math.min(1, dt*4); r.geometry.setDrawRange(0, Math.floor(r.userData.total*r.userData.show/3)*3); });
  }

  // phase bar
  phEls.forEach((el, i) => { const v = R.ph < 0 ? (R.n >= 0 ? 1 : 0) : i < R.ph ? 1 : i === R.ph ? R.p : 0; el.firstChild.style.width = (v*100) + '%'; el.classList.toggle('on', i === R.ph); });

  camFollow(dt);
  controls.update();
  renderer.render(scene, cam);
  const w = stage.clientWidth, h = stage.clientHeight;
  labels.forEach(l => { const show = !!l.showFn(); if (show){ const v = l.posFn().project(cam); l.el.style.left = ((v.x+1)/2*w) + 'px'; l.el.style.top = ((1-v.y)/2*h) + 'px'; } l.el.style.opacity = show ? 1 : 0; });
  requestAnimationFrame(frame);
}
resize(); home();
let s0 = 0; try { s0 = +localStorage.getItem('tulip2-step') || 0; } catch(e){}
showCard(Math.max(0, Math.min(4, s0))); plan(step);
frame();
</script>
